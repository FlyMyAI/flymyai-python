name: SDK offline contracts - bounded 7bf qualification
'on':
  push:
    branches:
    - feat/bounded-saved-sdk-ci-20261011
    paths:
    - .github/workflows/agents-contract.yml
permissions:
  contents: read
concurrency:
  group: bounded-sdk-7bf-qualification
  cancel-in-progress: false
defaults:
  run:
    shell: sh
env:
  SDK_BOUNDED_HELPER: |
    """Workflow-only SDK qualification; all commands stay in the job cgroup.

    The official job container supplies Python. Nothing runs on import.
    Dependencies use canonical public pip. Tests inherit an additive kernel
    seccomp network-denial filter. No namespace or extra capabilities are needed.
    The first action starts bounded sampling before checkout.
    """
    import base64
    import ctypes
    import errno
    import hashlib
    import importlib.metadata
    import json
    import os
    from pathlib import Path
    import platform
    import resource
    import selectors
    import signal
    import socket
    import stat
    import subprocess
    import sys
    import time
    import xml.etree.ElementTree as ET

    ROOT = Path('/tmp/sdk-bounded')
    LIMIT = 1536 * 1024**2
    BYTE_LIMIT = 1024**2


    def sha(path):
        return hashlib.sha256(path.read_bytes()).hexdigest()


    def cgroup():
        # Docker may expose a cgroup namespace with relative path '/'.
        relative = next(x.split(':', 2)[2] for x in Path('/proc/self/cgroup').read_text().splitlines() if x.startswith('0::'))
        candidates = (Path('/sys/fs/cgroup') / relative.lstrip('/'), Path('/sys/fs/cgroup'))
        return next(p for p in candidates if (p / 'memory.max').is_file())


    def guard():
        cg = cgroup()
        values = {name: (cg / name).read_text().strip() for name in ('memory.max', 'memory.swap.max', 'cpu.max', 'memory.events')}
        assert values['memory.max'] == str(LIMIT), 'container_memory_guard'
        assert values['memory.swap.max'] == '0', 'container_swap_guard'
        quota, period = values['cpu.max'].split()
        assert quota != 'max' and int(quota) <= int(period), 'container_CPU_guard'
        assert Path('/proc/1/cgroup').read_text() == Path('/proc/self/cgroup').read_text(), 'private_job_PID_namespace'
        assert not any(k in os.environ for k in ('FMA_APIKEY', 'FMA_API_KEY', 'FLYMYAI_API_KEY', 'AWS_SECRET_ACCESS_KEY', 'GH_TOKEN', 'GITHUB_TOKEN')), 'provider_or_bearer_environment'
        return cg, values


    def point(cg, started):
        stat = dict(row.split() for row in (cg / 'cpu.stat').read_text().splitlines())
        return {'elapsed_s': round(time.monotonic() - started, 3), 'memory_current_bytes': int((cg / 'memory.current').read_text()), 'cpu_usage_usec': int(stat['usage_usec']), 'cpu_throttled_usec': int(stat.get('throttled_usec', 0))}


    def clean_environment():
        env = {k: os.environ[k] for k in ('PATH', 'HOME', 'USER', 'LANG', 'LD_LIBRARY_PATH', 'SSL_CERT_FILE') if k in os.environ}
        env.update(PYTHONDONTWRITEBYTECODE='1', PIP_DISABLE_PIP_VERSION_CHECK='1', PIP_NO_CACHE_DIR='1', PIP_INDEX_URL='https://pypi.org/simple', PIP_CONFIG_FILE='/dev/null', NETRC='/dev/null', PYTHONPATH=str(Path.cwd()))
        return env


    def isolated(args):
        return [sys.executable, __file__, 'network-exec'] + args


    PROBE = """import asyncio,ctypes,errno,json,os,socket,subprocess,sys
    from pathlib import Path
    status=dict(x.split(':',1) for x in Path('/proc/self/status').read_text().splitlines() if ':' in x)
    assert status['NoNewPrivs'].strip()=='1'
    assert status['Seccomp'].strip()=='2'
    assert int(status['Seccomp_filters'])>=int(os.environ['SDK_BASE_FILTER_COUNT'])+1
    libc=ctypes.CDLL(None,use_errno=True);libc.syscall.restype=ctypes.c_long
    denied=[]
    for family in (2,10,16,17,40,44):
        ctypes.set_errno(0)
        result=libc.syscall(41,family,1,0)
        assert result==-1 and ctypes.get_errno()==errno.EPERM, 'raw_socket_not_denied'
        try:
            s=socket.socket(family,socket.SOCK_STREAM)
        except OSError as exc:
            assert exc.errno==errno.EPERM
        else:
            s.close();raise AssertionError('Python_socket_not_denied')
        denied.append(family)
    a,b=socket.socketpair();a.send(b'ok');assert b.recv(2)==b'ok';a.close();b.close()
    loop=asyncio.new_event_loop();loop.run_until_complete(asyncio.sleep(0));loop.close()
    child='import ctypes,errno,json;from pathlib import Path;l=ctypes.CDLL(None,use_errno=True);l.syscall.restype=ctypes.c_long;assert l.syscall(41,2,1,0)==-1 and ctypes.get_errno()==errno.EPERM;assert l.syscall(41,10,1,0)==-1 and ctypes.get_errno()==errno.EPERM;print(json.dumps({"fork_exec_socket_denial":True,"filters":[x for x in Path("/proc/self/status").read_text().splitlines() if x.startswith(("NoNewPrivs:","Seccomp:","Seccomp_filters:"))]}))'
    actual=subprocess.run([sys.executable,'-c',child],check=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=5)
    print(json.dumps({'architecture':'x86_64','audit_arch':'0xc000003e','denied_socket_families':denied,'raw_syscall_and_python_denials':True,'AF_UNIX_pair_and_asyncio':True,'descendant':json.loads(actual.stdout),'provider_calls':0,'guard':'kernel seccomp network denial; not a full hostile-code sandbox'}))
    """


    def install_network_filter():
        """x86_64 cBPF, installed before exec and inherited by every descendant."""
        assert platform.machine() == 'x86_64' and ctypes.sizeof(ctypes.c_void_p) == 8 and sys.byteorder == 'little', 'unsupported_syscall_ABI'
        libc = ctypes.CDLL(None, use_errno=True)
        libc.prctl.argtypes = [ctypes.c_int, ctypes.c_ulong, ctypes.c_ulong, ctypes.c_ulong, ctypes.c_ulong]
        libc.prctl.restype = ctypes.c_int

        class Instruction(ctypes.Structure):
            _fields_ = [('code', ctypes.c_ushort), ('jt', ctypes.c_ubyte), ('jf', ctypes.c_ubyte), ('k', ctypes.c_uint)]

        class Program(ctypes.Structure):
            _fields_ = [('length', ctypes.c_ushort), ('filter', ctypes.POINTER(Instruction))]

        # seccomp_data: nr@0, arch@4, args[0]@16. Linux x86_64 syscall table.
        # Unknown architectures and x32 ABI are killed, never matched as x86_64.
        allow = 0x7fff0000
        refuse = 0x00050000 | errno.EPERM
        kill = 0x80000000
        code = [(0x20, 0, 0, 4), (0x15, 1, 0, 0xc000003e), (0x06, 0, 0, kill), (0x20, 0, 0, 0), (0x45, 0, 1, 0x40000000), (0x06, 0, 0, kill)]
        # Avoid acquiring foreign descriptors or submitting sockets through
        # io_uring. This is a narrow trusted-unit network policy, not a sandbox.
        for number in (101, 272, 308, 310, 311, 321, 425, 426, 427, 438):
            code += [(0x15, 0, 1, number), (0x06, 0, 0, refuse)]
        for number in (41, 53):  # socket / socketpair: permit AF_UNIX only.
            code += [(0x15, 0, 4, number), (0x20, 0, 0, 16), (0x15, 0, 1, 1), (0x06, 0, 0, allow), (0x06, 0, 0, refuse)]
        code += [(0x06, 0, 0, allow)]
        instructions = (Instruction * len(code))(*(Instruction(*row) for row in code))
        program = Program(len(code), instructions)
        if libc.prctl(38, 1, 0, 0, 0) != 0:
            raise OSError(ctypes.get_errno(), 'PR_SET_NO_NEW_PRIVS denied')
        pointer = ctypes.cast(ctypes.pointer(program), ctypes.c_void_p).value
        if libc.prctl(22, 2, pointer, 0, 0) != 0:
            raise OSError(ctypes.get_errno(), 'PR_SET_SECCOMP filter denied')


    def network_exec(args):
        assert args and os.path.isabs(args[0]), 'absolute_exec_required'
        # Popen already uses close_fds. Re-prove/close at the actual exec boundary,
        # retaining only nonsocket stdin/stdout/stderr for bounded receipts.
        for name in os.listdir('/proc/self/fd'):
            fd = int(name)
            if fd > 2:
                try:
                    os.close(fd)
                except OSError as exc:
                    assert exc.errno == errno.EBADF
        for fd in (0, 1, 2):
            assert not stat.S_ISSOCK(os.fstat(fd).st_mode), 'inherited_network_stdio'
        status = dict(row.split(':', 1) for row in Path('/proc/self/status').read_text().splitlines() if ':' in row)
        os.environ['SDK_BASE_FILTER_COUNT'] = str(int(status.get('Seccomp_filters', '0')))
        install_network_filter()
        os.execv(args[0], args)


    def initialize():
        os.umask(0o077)
        ROOT.mkdir(exist_ok=False)
        cg, values = guard()
        expected = os.environ['SDK_EXPECTED_VERSION']
        assert '.'.join(str(x) for x in sys.version_info[:3]) == expected, 'official_Python_patch_version'
        assert sys.version_info[:2] in ((3, 8), (3, 12), (3, 13)), 'supported_Python'
        assert platform.machine() == 'x86_64', 'official_amd64_runtime_required'
        now = time.monotonic()
        # PID 1 predates every action. Exclude image pull/runner orchestration,
        # which is not workload executed in this job container.
        stat = Path('/proc/1/stat').read_text().rsplit(')', 1)[1].split()
        container_started = int(stat[19]) / os.sysconf('SC_CLK_TCK')
        assert 0 <= now - container_started < 285, 'container_elapsed_preflight_cap'
        info = {'started': container_started, 'first_action': now, 'deadline': container_started + 295, 'guard': values, 'initial_sample': point(cg, container_started), 'expected_version': expected, 'python': sys.version, 'canonical_job_timeout_minutes': 5, 'container_image': os.environ['SDK_CONTAINER_IMAGE'], 'added_capabilities': [], 'network_policy': 'additive seccomp plus no-new-privileges; only AF_UNIX sockets allowed in actual checks', 'host_image_pull_outside_workload_cgroup': True}
        pending = ROOT / 'preflight.tmp'
        pending.write_text(json.dumps(info, indent=2) + '\n')
        os.replace(pending, ROOT / 'preflight.json')
        # A background sampler also bounds a stalled checkout before pip starts.
        sampler = subprocess.Popen([sys.executable, __file__, 'sample'], env=clean_environment(), stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, start_new_session=True)
        info['sampler_pid'] = sampler.pid
        pending.write_text(json.dumps(info, indent=2) + '\n')
        os.replace(pending, ROOT / 'preflight.json')
        print('SDK_CONTAINER_PREFLIGHT=' + json.dumps(info, sort_keys=True), flush=True)


    def sample():
        info = json.loads((ROOT / 'preflight.json').read_text())
        cg, _ = guard()
        own_cgroup = Path('/proc/self/cgroup').read_text()
        with (ROOT / 'samples.jsonl').open('w') as stream:
            for _ in range(601):
                stream.write(json.dumps(point(cg, info['started']), separators=(',', ':')) + '\n')
                stream.flush()
                if (ROOT / 'finished').exists():
                    return
                if time.monotonic() >= info['deadline']:
                    (ROOT / 'watchdog.json').write_text(json.dumps({'status': 'CONTAINER_295S_WORK_DEADLINE', 'elapsed_s': time.monotonic() - info['started']}))
                    # Private PID and cgroup are checked above. Never signal a host
                    # or foreign cgroup. Leave PID1 and this sampler for teardown.
                    for path in Path('/proc').iterdir():
                        if path.name.isdigit() and int(path.name) not in (1, os.getpid()):
                            try:
                                if (path / 'cgroup').read_text() == own_cgroup:
                                    os.kill(int(path.name), signal.SIGKILL)
                            except (FileNotFoundError, ProcessLookupError, PermissionError):
                                pass
                    return
                time.sleep(.5)
        raise RuntimeError('bounded_resource_sample_count_exceeded')


    def run(mode):
        os.umask(0o077)
        assert mode in ('contracts', 'lint')
        cg, values = guard()
        info = json.loads((ROOT / 'preflight.json').read_text())
        assert time.monotonic() < info['deadline'] - 10, 'original_job_time_exhausted'
        resource.setrlimit(resource.RLIMIT_AS, (2 * 1024**3, 2 * 1024**3))
        resource.setrlimit(resource.RLIMIT_CPU, (300, 300))
        resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
        golden = json.loads((ROOT / 'payload.json').read_text())
        payload = golden['payload_sha256']
        env = clean_environment()
        record = {'status': 'RUNNING', 'mode': mode, 'source': golden['source'], 'parent_workflow_sha256': golden['parent_workflow_sha256'], 'payload_manifest_sha256': sha(ROOT / 'payload.json'), 'payload_files': len(payload), 'preflight': info, 'guard_after_checkout': values, 'phases': [], 'SQL': 0, 'FMA_provider_calls': 0, 'paid_compute_jobs': 0, 'canonical_public_CI_pip': True, 'custom_image_builds': 0, 'artifact_or_cache_uploads': 0}
        total_log_bytes = 0

        def save():
            (ROOT / 'receipt.json').write_text(json.dumps(record, indent=2) + '\n')

        def phase(label, args, environment, must_succeed=True):
            nonlocal total_log_bytes
            item = {'name': label, 'command': args, 'started_s': time.monotonic() - info['started']}
            record['phases'].append(item)
            save()
            process = subprocess.Popen(args, env=environment, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, start_new_session=True)
            poll = selectors.DefaultSelector()
            poll.register(process.stdout, selectors.EVENT_READ)
            reason = None
            try:
                with (ROOT / (label + '.log')).open('wb') as log:
                    while poll.get_map() or process.poll() is None:
                        if time.monotonic() >= info['deadline'] - 5:
                            reason = 'original_300s_whole_job_including_cleanup'
                        if reason and process.poll() is None:
                            os.killpg(process.pid, signal.SIGKILL)
                        for key, _ in poll.select(timeout=.2):
                            block = os.read(key.fileobj.fileno(), 32768)
                            if not block:
                                poll.unregister(key.fileobj)
                                continue
                            room = BYTE_LIMIT - total_log_bytes
                            log.write(block[:room])
                            total_log_bytes += min(room, len(block))
                            if len(block) > room:
                                reason = 'combined_log_1MiB_cap'
                code = process.wait(timeout=2)
            finally:
                try:
                    os.killpg(process.pid, signal.SIGKILL)
                except ProcessLookupError:
                    pass
                if process.poll() is None:
                    process.wait(timeout=2)
                poll.close()
                process.stdout.close()
            item.update(exit=code, reason=reason, finished_s=time.monotonic() - info['started'])
            save()
            if must_succeed:
                assert code == 0 and reason is None, label + '_failed'
            return code, reason

        before = {}
        try:
            assert len(payload) == 91, 'frozen_payload_count'
            before = {name: sha(Path(name)) for name in payload}
            assert before == payload, 'frozen_7bf_payload_mismatch'
            assert '.'.join(str(x) for x in sys.version_info[:3]) == info['expected_version'], 'Python_version_changed'
            phase('network-preflight', isolated([sys.executable, '-c', PROBE]), env)
            if mode == 'lint':
                phase('canonical-lint-dependencies', [sys.executable, '-m', 'pip', 'install', 'black==23.12.1', 'flake8==7.3.0'], env)
                record['resolved_dependencies'] = {n: importlib.metadata.version(n) for n in ('black', 'flake8')}
                phase('canonical-black', isolated([sys.executable, '-m', 'black', '--preview', '--check', '.']), env)
                phase('canonical-flake8', isolated([sys.executable, '-m', 'flake8', '--max-line-length=88', 'flymyai/agents/_mcp_personal.py', 'tests/test_mcp_personal.py']), env)
            else:
                phase('canonical-dependencies', [sys.executable, '-m', 'pip', 'install', '.', 'pytest', 'pytest-asyncio', 'respx'], env)
                record['resolved_dependencies'] = {n: importlib.metadata.version(n) for n in ('pytest', 'pytest-asyncio', 'respx', 'httpx', 'pydantic')}
                plugin = ROOT / 'bounded_collection.py'
                plugin.write_text('import collections,json,os\nfrom pathlib import Path\ndef pytest_collection_finish(session):\n    assert len(session.items)<=4096,"collected_case_cap"\n    rows=[{"nodeid":x.nodeid,"module":str(x.path.relative_to(session.config.rootpath))} for x in session.items]\n    Path(os.environ["SDK_COLLECTION_PATH"]).write_text(json.dumps({"total":len(rows),"modules":dict(collections.Counter(x["module"] for x in rows)),"cases":rows},indent=2)+"\\n")\n')
                env.update(PYTHONPATH=str(ROOT) + os.pathsep + str(Path.cwd()), SDK_COLLECTION_PATH=str(ROOT / 'collection.json'))
                args = [sys.executable, '-m', 'pytest', 'tests', '--ignore=tests/test_async_inference.py', '--ignore=tests/test_flymyai_client.py', '--ignore=tests/test_stream.py', '-q', '-p', 'bounded_collection', '-p', 'no:cacheprovider', '--junitxml=' + str(ROOT / 'pytest.xml')]
                actual_exit, actual_reason = phase('whole-offline-contracts', isolated(args), env, must_succeed=False)
                assert (ROOT / 'pytest.xml').stat().st_size <= BYTE_LIMIT, 'JUnit_byte_cap'
                assert (ROOT / 'collection.json').stat().st_size <= BYTE_LIMIT, 'collection_byte_cap'
                root = ET.fromstring((ROOT / 'pytest.xml').read_bytes())
                cases = list(root.iter('testcase'))
                collection = json.loads((ROOT / 'collection.json').read_text())
                record['actual_collection'] = {'total': collection['total'], 'modules': collection['modules'], 'sha256': sha(ROOT / 'collection.json')}
                record['JUnit'] = {'bytes': (ROOT / 'pytest.xml').stat().st_size, 'sha256': sha(ROOT / 'pytest.xml'), 'cases': len(cases), 'failures': len(list(root.iter('failure'))), 'errors': len(list(root.iter('error'))), 'skips': len(list(root.iter('skipped')))}
                assert len(cases) == collection['total'], 'whole_JUnit_collection_mismatch'
                record['affected_module_results'] = {}
                for module in ('tests/test_saved_versions.py', 'tests/test_agent_client.py'):
                    prefix = module[:-3].replace('/', '.')
                    actual = [x for x in cases if x.get('classname', '') == prefix or x.get('classname', '').startswith(prefix + '.')]
                    counts = {'cases': len(actual), 'failures': sum(x.find('failure') is not None for x in actual), 'errors': sum(x.find('error') is not None for x in actual), 'skips': sum(x.find('skipped') is not None for x in actual)}
                    record['affected_module_results'][module] = counts
                    assert counts['cases'] > 0 and counts['cases'] == collection['modules'].get(module), 'affected_whole_module_not_executed'
                assert not record['JUnit']['failures'] and not record['JUnit']['errors'] and not record['JUnit']['skips'], 'whole_offline_failure_or_skip'
                assert actual_exit == 0 and actual_reason is None, 'whole_offline_contracts_failed'
            record['status'] = 'PASS'
        except Exception as exc:
            record.update(status='FAIL', error={'type': type(exc).__name__, 'message': str(exc)[:300]})
        finally:
            record['payload_preserved'] = {name: sha(Path(name)) for name in payload} == payload
            if not record['payload_preserved']:
                record['status'] = 'FAIL'
            record['container_elapsed_s'] = time.monotonic() - info['started']
            if record['container_elapsed_s'] >= 295:
                record['status'] = 'FAIL'
            record['cgroup_memory_peak_bytes'] = int((cg / 'memory.peak').read_text())
            record['cgroup_cpu_after'] = (cg / 'cpu.stat').read_text()
            record['memory_events_after'] = (cg / 'memory.events').read_text()
            events = dict(row.split() for row in record['memory_events_after'].splitlines())
            if int(events['oom']) or int(events['oom_kill']):
                record['status'] = 'FAIL'
            record['combined_phase_log_bytes'] = total_log_bytes
            save()
            (ROOT / 'finished').touch()
        return 0 if record['status'] == 'PASS' else 1


    def export():
        # Ordinary bounded CI log records, with no artifact/cache/upload action.
        files = ['preflight.json', 'receipt.json', 'collection.json', 'pytest.xml', 'samples.jsonl', 'watchdog.json']
        files += [p.name for p in sorted(ROOT.glob('*.log'))]
        total = 0
        for name in files:
            path = ROOT / name
            if path.is_file():
                size = path.stat().st_size
                assert size <= BYTE_LIMIT, 'receipt_file_byte_cap'
                total += size
                assert total <= 3 * BYTE_LIMIT, 'receipt_export_total_cap'
                print('SDK_BOUNDED_FILE=' + name + ':' + base64.b64encode(path.read_bytes()).decode(), flush=True)


    if __name__ == '__main__':
        command = sys.argv[1]
        if command == 'initialize':
            initialize()
        elif command == 'sample':
            sample()
        elif command == 'export':
            export()
        elif command == 'network-exec':
            network_exec(sys.argv[2:])
        elif command == 'probe-source':
            network_exec([sys.executable, '-c', PROBE])
        else:
            raise SystemExit(run(command))
