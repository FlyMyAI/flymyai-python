name: Agents SDK contracts

on:
  push:
    branches: ['feat/**']
    paths:
      - 'flymyai/agents/**'
      - 'tests/test_*agent*.py'
      - 'tests/test_mcp_*.py'
      - 'tests/test_browser_use.py'
      - '.github/workflows/agents-contract.yml'
  pull_request:
    paths:
      - 'flymyai/agents/**'
      - 'tests/test_*agent*.py'
      - 'tests/test_mcp_*.py'
      - 'tests/test_browser_use.py'
      - '.github/workflows/agents-contract.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install . pytest pytest-asyncio respx
      # Offline HTTP transports only. Never use production credentials here.
      - run: >-
          python -m pytest tests/test_agent_client.py tests/test_agents_variables.py
          tests/test_agents_embedded_context.py tests/test_browser_use.py
          tests/test_subagent_limits.py tests/test_mcp_resource_scopes.py
          tests/test_mcp_personal.py tests/test_mcp_teams.py -q
