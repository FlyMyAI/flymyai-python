jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
        - python-version: '3.8'
          version: 3.8.20
          image: docker.io/library/python:3.8.20-bookworm@sha256:7aa279fb41dad2962d3c915aa6f6615134baa412ab5aafa9d4384dcaaa0af15d
        - python-version: '3.12'
          version: 3.12.10
          image: docker.io/library/python:3.12.10-bookworm@sha256:8191c572cf979a5dbc7345474ed93d96c56a6ac95c1dae2451132fe1ba633ae3
        - python-version: '3.13'
          version: 3.13.3
          image: docker.io/library/python:3.13.3-bookworm@sha256:091f21ccc2f4d319f220582c4e33801e99029f788d5767f74c8cff5396cf4fa5
    container:
      image: ${{ matrix.image }}
      options: --memory=1536m --memory-swap=1536m --cpus=1 --pids-limit=128 --security-opt=no-new-privileges
    env:
      SDK_PHASE: contracts
      SDK_EXPECTED_VERSION: ${{ matrix.version }}
      SDK_CONTAINER_IMAGE: ${{ matrix.image }}
    steps:
    - name: Verify whole-job cgroup and Python; start bounded samples before checkout
      run: |
        set -eu
        umask 077
        python - <<'PY'
        import os
        from pathlib import Path
        Path('/tmp/sdk-bounded-job.py').write_text(os.environ['SDK_BOUNDED_HELPER'])
        PY
        python /tmp/sdk-bounded-job.py initialize
        python - <<'PY'
        import os
        from pathlib import Path
        Path('/tmp/sdk-bounded/payload.json').write_text(os.environ['SDK_BOUNDED_PAYLOAD'])
        PY
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: ${{ github.sha }}
    - name: Canonical dependencies and complete offline modules or lint
      run: python /tmp/sdk-bounded-job.py "$SDK_PHASE"
    - name: Bounded actual JUnit, collection and resource receipts in ordinary logs
      if: ${{ always() }}
      run: python /tmp/sdk-bounded-job.py export
  lint:
    needs:
    - contracts
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: docker.io/library/python:3.13.3-bookworm@sha256:091f21ccc2f4d319f220582c4e33801e99029f788d5767f74c8cff5396cf4fa5
      options: --memory=1536m --memory-swap=1536m --cpus=1 --pids-limit=128 --security-opt=no-new-privileges
    env:
      SDK_PHASE: lint
      SDK_EXPECTED_VERSION: 3.13.3
      SDK_CONTAINER_IMAGE: docker.io/library/python:3.13.3-bookworm@sha256:091f21ccc2f4d319f220582c4e33801e99029f788d5767f74c8cff5396cf4fa5
    steps:
    - name: Verify whole-job cgroup and Python; start bounded samples before checkout
      run: |
        set -eu
        umask 077
        python - <<'PY'
        import os
        from pathlib import Path
        Path('/tmp/sdk-bounded-job.py').write_text(os.environ['SDK_BOUNDED_HELPER'])
        PY
        python /tmp/sdk-bounded-job.py initialize
        python - <<'PY'
        import os
        from pathlib import Path
        Path('/tmp/sdk-bounded/payload.json').write_text(os.environ['SDK_BOUNDED_PAYLOAD'])
        PY
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: ${{ github.sha }}
    - name: Canonical dependencies and complete offline modules or lint
      run: python /tmp/sdk-bounded-job.py "$SDK_PHASE"
    - name: Bounded actual JUnit, collection and resource receipts in ordinary logs
      if: ${{ always() }}
      run: python /tmp/sdk-bounded-job.py export
